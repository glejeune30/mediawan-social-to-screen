<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Radar · Mediawan × Albert School</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/radar" aria-label="Story Radar, accueil">
        <img class="brand-icon" src="assets/logo.svg" alt="">
        <span><span class="brand-name">Story Radar</span><span class="brand-sub">From Social to Screen</span></span>
      </a>
      <nav class="nav" id="nav" aria-label="Navigation"></nav>
      <div class="partner">
        <div class="partner-cap">Étude de cas pour</div>
        <div class="partner-logo" id="partner-logo"><span class="partner-word">MEDIAWAN</span></div>
        <div class="partner-with">avec <b>Albert School</b></div>
        <div class="partner-team">Business Deep Dive · Team 21</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <label class="search">
          <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="global-search" type="search" placeholder="Rechercher un titre ou un auteur  ( / )" autocomplete="off">
        </label>
        <div class="topbar-right">
          <span class="snapshot" id="snapshot"></span>
          <button class="btn" id="refresh" type="button" title="Récupérer les données de la semaine"><span class="btn-label">Rafraîchir les données</span></button>
        </div>
      </header>
      <section class="view" id="view" aria-live="polite"></section>
    </main>
  </div>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-backdrop"></div>
    <div class="drawer-panel" role="dialog" aria-label="Fiche de l'histoire"></div>
  </div>
  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
